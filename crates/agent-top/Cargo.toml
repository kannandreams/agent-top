[package]
name = "agent-top"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true

[[bin]]
name = "agent-top"
path = "src/main.rs"

[dependencies]
agent-top-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
ratatui.workspace = true
serde_json.workspace = true

# `cargo binstall agent-top` downloads the release asset instead of compiling.
# These patterns must match the names the release workflow produces.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
