# Documentation site for agent-top, built with Material for MkDocs.
#
#   mise run docs:serve     # preview at http://127.0.0.1:8000
#   mise run docs:build     # strict build into site/, what CI checks
#   mise run docs:publish   # build, then upload site/ to Cloudflare Pages
#
# The tasks run mkdocs through uv from docs/requirements.txt; no virtualenv,
# no pip. The site serves its own font and scripts and has no analytics; the
# one outside request a page makes is to the GitHub API, for the star, fork
# and version badge in the header.

site_name: agent-top
site_description: htop for local coding agents. Processes, subagents, MCP servers, tokens and cost in one terminal view.
site_url: https://agenttop.dev
repo_url: https://github.com/kannandreams/agent-top
repo_name: kannandreams/agent-top
edit_uri: edit/main/docs/
copyright: <span class="at-footer">MIT licensed. <img src="/assets/logo-white.svg" alt="" width="18" height="18"> agent-top is built with ❤️ and 🦀 Rust.</span>

docs_dir: docs
site_dir: site
strict: true

# Recording scripts are source, not pages.
exclude_docs: |
  *.tape
  requirements.txt
  hooks/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  # No web fonts: the stylesheet names system faces instead.
  font: false
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/changelog_links.py
  - docs/hooks/cache_bust.py
  - docs/hooks/nav_icons.py
  - docs/hooks/security_scan.py
  - docs/hooks/recent_posts.py
  - docs/hooks/repo_stars.py

extra:
  generator: false
  # One line under each page in the header's Docs menu
  # (docs/overrides/partials/header.html), by source path.
  menu_notes:
    getting-started.md: Install, first run, the keys
    live-view.md: Every panel and where its numbers come from
    views-and-panes.md: Popups, pinned panels and multiplexer panes
    context-timeline.md: Prompt size, compactions and what filled them
    trace.md: Tool calls as a Chrome or OTLP trace
    replay.md: Save the screen as JSON, open it anywhere
    report.md: Cost and tokens by harness, model, project or day
    prices.md: The price table and how to override it
    accounting.md: Where each number comes from
    energy.md: CO2e and energy from your own table
    store/index.md: A SQLite file that keeps the history
    store/sync.md: Read transcripts into the store
    store/query.md: Read-only SQL, with saved views
    store/ui.md: The local web dashboard
    store/telemetry.md: OpenTelemetry spans from your own agents
    store/schema.md: Tables and columns
    harnesses.md: What is read from each harness
  # Sections in the Docs menu, by column; any section not named here goes in
  # the strip along the bottom.
  menu_columns:
    - [Using agent-top]
    - [Cost, Harnesses]
    - [Local store]
  # Icons for the top-level sidebar entries, by title, applied by
  # docs/hooks/nav_icons.py. Names are Material's bundled icon paths.
  nav_icons:
    Getting started: octicons/rocket-16
    Using agent-top: octicons/terminal-16
    Cost: octicons/credit-card-16
    Local store: octicons/database-16
    Harnesses: octicons/plug-16
    Project: octicons/repo-16
    Blogs: octicons/note-16
    GitHub: octicons/mark-github-16
    crates.io: octicons/package-16
    Security scan: octicons/shield-check-16

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
      post_excerpt: required
      authors_file: "{blog}/.authors.yml"
      archive: false
      categories: false

nav:
  - Getting started: getting-started.md
  - Using agent-top:
      - The live view: live-view.md
      - Views and panes: views-and-panes.md
      - Reading the context timeline: context-timeline.md
      - Tool trace and export: trace.md
      - Snapshots and replay: replay.md
  - Cost:
      - Cost report: report.md
      - Prices: prices.md
      - Accounting: accounting.md
      - Energy and CO2e: energy.md
  - Local store:
      - Overview: store/index.md
      - Sync: store/sync.md
      - Query: store/query.md
      - Web view: store/ui.md
      - Receive telemetry: store/telemetry.md
      - Schema: store/schema.md
  - Harnesses:
      - Harness support: harnesses.md
  - Project:
      - Why agent-top exists: why-this-exists.md
      - Vision: vision.md
      - Security: security.md
      - Architecture: architecture.md
      - Changelog: changelog.md
      - Credits: credits.md
  - Blogs:
      - blog/index.md
  - GitHub: https://github.com/kannandreams/agent-top
  - crates.io: https://crates.io/crates/agent-top
  # Root-relative on purpose: the Security page already sits under Project, and
  # naming the file twice would make mkdocs read this as the page's position in
  # the nav, which breaks its previous/next footer. docs/hooks/security_scan.py
  # rewrites this label to the count the last scan actually found.
  - Security scan: /security/
