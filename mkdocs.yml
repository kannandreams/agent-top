# Documentation site for agent-top, built with Material for MkDocs.
#
#   mise run docs:serve     # preview at http://127.0.0.1:8000
#   mise run docs:build     # strict build into site/, what CI checks
#   mise run docs:publish   # build, then upload site/ to Cloudflare Pages
#
# The tasks run mkdocs through uv from docs/requirements.txt; no virtualenv,
# no pip. The site serves its own font and scripts and has no analytics; the
# one outside request a page makes is to the GitHub API, for the star, fork
# and version badge in the header.

site_name: agent-top
site_description: htop for local coding agents. Processes, subagents, MCP servers, tokens and cost in one terminal view.
site_url: https://agenttop.dev
repo_url: https://github.com/kannandreams/agent-top
repo_name: kannandreams/agent-top
edit_uri: edit/main/docs/
copyright: <span class="at-footer">MIT licensed. <img src="/assets/favicon.svg" alt="" width="18" height="18"> agent-top is built with ❤️ and 🦀 Rust.</span>

docs_dir: docs
site_dir: site
strict: true

# Recording scripts are source, not pages.
exclude_docs: |
  *.tape
  requirements.txt
  hooks/
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  # No web fonts: the stylesheet names system faces instead.
  font: false
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/changelog_links.py

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
      post_excerpt: required
      authors_file: "{blog}/.authors.yml"
      archive: false
      categories: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - The live view: live-view.md
      - Cost report: report.md
      - Tool trace and export: trace.md
      - Snapshots and replay: replay.md
      - Prices: prices.md
      - Accounting: accounting.md
      - Harness support: harnesses.md
  - Project:
      - Why agent-top exists: why-this-exists.md
      - Vision: vision.md
      - Architecture: architecture.md
      - Changelog: changelog.md
      - Credits: credits.md
  - Blog:
      - blog/index.md
  - GitHub: https://github.com/kannandreams/agent-top
  - crates.io: https://crates.io/crates/agent-top
