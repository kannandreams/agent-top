min_version = "2025.12.12"

[settings]
lockfile = true

[tools]
rust = { version = "1.96.0", components = ["rustfmt", "clippy"] }

[tasks.build]
description = "Build the workspace"
run = "cargo build"

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.lint]
description = "Format check and clippy"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.check]
description = "Everything CI runs"
run = [{ task = "lint" }, { task = "test" }]

[tasks.run]
description = "Run the TUI"
raw = true
run = "cargo run --"

# Supply-chain checks. Needs cargo-deny and cargo-audit:
#   cargo install --locked cargo-deny cargo-audit
[tasks.security]
description = "Advisory, licence and source checks over the dependency tree"
run = ["cargo deny check advisories bans licenses sources", { task = "security:report" }]

[tasks."security:report"]
description = "Rescan with cargo-audit and rewrite docs/data/security.json"
run = "python3 scripts/security_report.py"

# The documentation site (mkdocs.yml at the root, pages in docs/). Every
# Python step goes through uv, which makes a throwaway environment from
# docs/requirements.txt; nothing is installed with pip and there is no venv.
[tasks."docs:serve"]
description = "Preview the docs site at http://127.0.0.1:8000, rebuilding on save"
run = "uv run --with-requirements docs/requirements.txt mkdocs serve"

[tasks."docs:build"]
description = "Build the docs site into site/ in strict mode (what CI checks)"
run = "uv run --with-requirements docs/requirements.txt mkdocs build --strict"

[tasks."docs:publish"]
description = "Build the docs site and upload site/ to Cloudflare Pages (needs `npx wrangler login` once)"
depends = ["docs:build"]
run = "npx --yes wrangler@4 pages deploy site --project-name agent-top --branch main --commit-dirty=true"
