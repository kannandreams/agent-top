[workspace]
members = ["crates/agent-top-core", "crates/agent-top"]
resolver = "2"

[workspace.package]
version = "0.12.2"
edition = "2024"
license = "MIT"
authors = ["Kannan Kalidasan"]
repository = "https://github.com/kannandreams/agent-top"
description = "htop for local coding agents: processes, subagents, MCP servers, tokens and cost in one terminal view."
# Resolved relative to the workspace root and copied into each published
# package, so crates.io shows the real README instead of an empty page.
readme = "README.md"

[workspace.dependencies]
agent-top-core = { path = "crates/agent-top-core", version = "0.12.2" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
thiserror = "2.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# OpenCode stores its sessions in a SQLite database, not a JSONL log. `bundled`
# compiles SQLite into the binary so the single-static-binary promise holds and
# there is no system libsqlite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# Only for `agent-top trace --endpoint`, which posts one file where the user says.
ureq = "3.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
