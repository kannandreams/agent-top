name: Release

# Tagging is the whole release trigger: `git tag v0.2.0 && git push --tags`.
# Everything below is derived from the tag, so a release cannot disagree with
# what is in the repository at that commit.
on:
  push:
    tags: ["v*"]
  # Preflight. Publishes nothing: it only proves the credentials a release
  # needs are present and carry the right permissions, which is otherwise not
  # discovered until a tag has already put binaries in front of users.
  workflow_dispatch:

permissions:
  contents: write

env:
  MISE_LOCKED: "1"

jobs:
  credentials:
    name: check release credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Homebrew tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; releases will skip the tap bump."
            exit 1
          fi
          # `permissions.push` is what the token can do to that repository, so
          # this catches a read-only or wrong-repository token here rather than
          # at `git push`, after the release is already public.
          perms="$(GH_TOKEN="$TAP_TOKEN" gh api repos/kannandreams/homebrew-tap --jq '.permissions.push // "none"' 2>&1)" || {
            echo "::error::the token cannot read kannandreams/homebrew-tap: $perms"
            exit 1
          }
          if [ "$perms" != "true" ]; then
            echo "::error::the token can read the tap but not write to it (permissions.push=$perms). It needs Contents: read and write."
            exit 1
          fi
          echo "HOMEBREW_TAP_TOKEN can write to kannandreams/homebrew-tap"

      - name: crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; releases will skip crates.io. This is optional."
          else
            echo "CARGO_REGISTRY_TOKEN is set"
          fi

  # A tag must not publish what CI would have rejected. Without this the
  # release workflow only built and smoke-ran the binary, so v0.2.0 went to
  # crates.io and the Homebrew tap while a test was failing on Linux.
  test:
    name: test (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install development toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          version: 2026.8.2
          cache: true
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Run repository checks (fmt, clippy, tests)
        run: mise run check

  build:
    name: build (${{ matrix.target }})
    needs: test
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, arch: arm64, native: true }
          # Cross-compiled from the arm64 runner rather than built on macos-13:
          # the Apple SDK carries both slices so no extra linker is needed, and
          # the Intel runner image is on GitHub's retirement path.
          - { os: macos-14, target: x86_64-apple-darwin, arch: x86_64, native: false }
          # Built on 22.04 on purpose: the binary links the runner's glibc, so
          # building on the newest image would refuse to start on any older
          # distribution. 22.04 gives a glibc 2.35 floor.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x86-64, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: aarch64, native: true }
    steps:
      - uses: actions/checkout@v5

      - name: Install development toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          version: 2026.8.2
          cache: true

      - name: Add the target to the pinned toolchain
        run: |
          # Read the version from mise.toml rather than repeating it here, and
          # name the toolchain explicitly so the target cannot land on the
          # runner's own default Rust while cargo uses mise's.
          toolchain="$(awk -F'"' '/^rust *=/{print $2}' mise.toml)"
          echo "pinned toolchain: $toolchain"
          rustup target add --toolchain "$toolchain" "${{ matrix.target }}"

      - name: Build
        run: cargo build --release --locked -p agent-top --target ${{ matrix.target }}

      - name: Verify the binary is the architecture it claims
        run: |
          out="$(file target/${{ matrix.target }}/release/agent-top)"
          echo "$out"
          case "$out" in
            *"${{ matrix.arch }}"*) ;;
            *) echo "built ${{ matrix.target }} but the binary is not ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="agent-top-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp target/${{ matrix.target }}/release/agent-top "dist/$stage/"
          cp README.md LICENSE CHANGELOG.md "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "dist/$stage"
          # Homebrew and cargo-binstall both verify this.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Skipped for the cross-compiled target: the runner cannot be relied on
      # to execute a foreign architecture.
      - name: Smoke-test the packaged binary
        if: matrix.native
        run: |
          ./target/${{ matrix.target }}/release/agent-top --version
          ./target/${{ matrix.target }}/release/agent-top --json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: dist-*
          merge-multiple: true

      - name: Check the tag matches the version in Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$version" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $manifest" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk '/^## /{ if (seen++) exit } seen' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" staging/* \
            --title "agent-top $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md.}"

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the tap bump. See docs/releasing.md."
            exit 0
          fi
          ./packaging/homebrew/render-formula.sh "$VERSION" staging > /tmp/agent-top.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/kannandreams/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/agent-top.rb /tmp/tap/Formula/agent-top.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-top.rb
          # Re-running publish for a tag that was already bumped stages nothing,
          # and `git commit` treats that as an error. Nothing to do is success.
          if git diff --cached --quiet; then
            echo "::notice::the tap already has agent-top ${VERSION}; nothing to push"
            exit 0
          fi
          git commit -m "agent-top ${VERSION}"
          git push

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io. See docs/releasing.md."
            exit 0
          fi
          # The core crate first: agent-top depends on it by version.
          # A version already on crates.io is not an error to re-run into --
          # publishing is irreversible, so a retried job must skip what landed
          # rather than fail on it.
          for crate in agent-top-core agent-top; do
            if curl -sf -H "User-Agent: agent-top-release" \
                 "https://crates.io/api/v1/crates/${crate}/${VERSION}" > /dev/null; then
              echo "::notice::${crate} ${VERSION} is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
